name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      JAVA_HOME: /opt/jdk17

    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17 manually (avoid setup-java init script injection)
        run: |
          sudo mkdir -p $JAVA_HOME
          curl -sL https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse -o /tmp/jdk17.tar.gz
          sudo tar -xzf /tmp/jdk17.tar.gz -C /opt
          sudo mv /opt/jdk-17* $JAVA_HOME
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          $JAVA_HOME/bin/java -version

      - name: Install Android SDK cmdline-tools
        run: |
          sudo mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          sudo unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          sudo mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses
          sdkmanager --sdk_root=$ANDROID_HOME \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --no-init-script

      - name: Run lint
        run: ./gradlew lint --no-daemon --no-init-script

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
