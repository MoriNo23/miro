name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_HOME: /opt/gradle-8.5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle 8.5 (manual, skip wrapper)
        run: |
          curl -sL -o /tmp/gradle-8.5-bin.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q /tmp/gradle-8.5-bin.zip -d /opt
          sudo mv /opt/gradle-8.5 $GRADLE_HOME
          echo "$GRADLE_HOME/bin" >> $GITHUB_PATH
          gradle --version

      - name: Install Android SDK cmdline-tools
        run: |
          sudo mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          sudo unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          sudo mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses
          sdkmanager --sdk_root=$ANDROID_HOME \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --no-init-script

      - name: Run lint
        run: gradle lint --no-daemon --no-init-script

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
